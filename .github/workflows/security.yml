name: Security

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  actions: read
  # security-events: write  # NOTE: Uncomment when enabling the custom CodeQL job below

jobs:
  audit:
    name: Dependency Audit & SBOM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify Go modules and capture dependency inventory
        run: |
          go mod verify
          go list -m -json all > dependency-inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-inventory
          path: dependency-inventory.json
          retention-days: 30

  # NOTE: Uncomment this job for personal accounts or organizations where GitHub Default CodeQL Setup is disabled.
  # Organization-managed repositories with Default CodeQL Setup enabled run CodeQL automatically and reject duplicate SARIF uploads.
