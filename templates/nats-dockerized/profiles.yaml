# nats-dockerized profiles — one scalable template, sized per node.
# Selected via provision.yaml: services: { nats: { profile: <name> } }
# Ladder from a 1c/1GB node up to a 200c/512GB (1TB VPS) node.
lite:
  max_connections: 100
  max_file_store: 2GB
  max_memory_store: 128MB
  mem_limit: 1g
  cpus: 1
normal:
  max_connections: 1000
  max_file_store: 10GB
  max_memory_store: 256MB
  mem_limit: 2g
  cpus: 2
small:
  max_connections: 2000
  max_file_store: 25GB
  max_memory_store: 512MB
  mem_limit: 4g
  cpus: 4
medium:
  max_connections: 5000
  max_file_store: 50GB
  max_memory_store: 1GB
  mem_limit: 8g
  cpus: 8
large:
  max_connections: 10000
  max_file_store: 100GB
  max_memory_store: 2GB
  mem_limit: 16g
  cpus: 16
xlarge:
  max_connections: 20000
  max_file_store: 250GB
  max_memory_store: 4GB
  mem_limit: 32g
  cpus: 32
2xl:
  max_connections: 50000
  max_file_store: 500GB
  max_memory_store: 8GB
  mem_limit: 64g
  cpus: 64
4xl:
  max_connections: 100000
  max_file_store: 1TB
  max_memory_store: 16GB
  mem_limit: 128g
  cpus: 128
8xl:
  max_connections: 200000
  max_file_store: 2TB
  max_memory_store: 64GB
  mem_limit: 512g
  cpus: 200
