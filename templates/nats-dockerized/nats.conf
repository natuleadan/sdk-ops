# nats-dockerized — rendered NATS JetStream cluster node config.
# Rendered at provision time from the node's profile + cluster topology.
server_name: {{ .ServerName }}
{{ if .ServerTags }}server_tags: {{ .ServerTags }}
{{ end }}{{ if .ClientAdvertise }}client_advertise: {{ .ClientAdvertise }}
{{ end }}listen: 0.0.0.0:4222
http: 127.0.0.1:8222
max_connections: {{ .MaxConnections }}
max_payload: 1MB
max_pending: 100MB

tls {
  cert_file: "/certs/server.pem"
  key_file:  "/certs/server.key"
  ca_file:   "/certs/ca.pem"
  timeout: 2
  verify: true
  handshake_first: true
}

jetstream {
  store_dir: /data
  max_memory_store: {{ .MaxMemoryStore }}
  max_file_store: {{ .MaxFileStore }}
  sync_interval: 120s
  key: $JS_KEY
}

cluster {
  name: {{ .ClusterName }}
  listen: 0.0.0.0:6222
  advertise: {{ .Advertise }}:6222
  routes: [
    {{ range .Routes }}nats://{{ . }}:6222
    {{ end }}
  ]
  tls {
    cert_file: "/certs/server.pem"
    key_file:  "/certs/server.key"
    ca_file:   "/certs/ca.pem"
  }
}

system_account: SYS
authorization {
  timeout: "2s"
  users: [
    {
      user: "app"
      password: "{{ .AppPasswordHash }}"
      permissions: {
        publish: {
          allow: {{ .AppPublishAllow }}
        }
        subscribe: {
          allow: {{ .AppSubscribeAllow }}
        }
      }
    }
    {
      user: "svc"
      password: "{{ .SvcPasswordHash }}"
      permissions: {
        publish: {
          allow: ["svc.>"]
          deny: ["svc.secret"]
        }
        subscribe: {
          allow: ["svc.>", "_INBOX.>"]
          deny: ["svc.audit.>"]
        }
      }
    }
  ]
}
accounts {
  SYS: {
    users: [
      { user: "sys", password: "{{ .SysPasswordHash }}" }
    ]
  }
}
