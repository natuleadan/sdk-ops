name: etcd
description: etcd DCS shared (3-member quorum 2/3) — the consensus layer for Patroni + future services. S3 snapshot backup/restore for DR.
ports:
  - "2379:2379"  # client (Patroni + health)
  - "2380:2380"  # peer (RAFT between members)
health:
  path: /health
  interval: 15
commands:
  validate: bash validate.sh
  snapshot: bash snapshot.sh
  backup: bash backup-s3.sh
  restore: bash restore-s3.sh [-y|--yes] [snapshot]
  test: bash test/test.sh
