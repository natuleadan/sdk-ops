name: etcd-shared
# etcd DCS shared — one member per node ({{ .EtcdName }} @ {{ .EtcdIP }}).
# The cluster is static-bootstrapped (initial-cluster state=new on first boot).
# v2 API enabled (Patroni uses python-etcd v2). Quorum: 2/3 for a 3-member set.
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    command:
      - etcd
      - --name={{ .EtcdName }}
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://{{ .EtcdIP }}:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://{{ .EtcdIP }}:2380
      - --initial-cluster={{ .InitialCluster }}
      - --initial-cluster-state=new
      - --initial-cluster-token=etcd-shared
      - --auto-compaction-retention=2
      - --enable-v2=true
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - ./data/etcd:/etcd-data
    mem_limit: {{ .MemLimit }}
    cpus: {{ .Cpus }}
    restart: unless-stopped
    networks:
      - default
networks:
  default:
    enable_ipv6: true
