name: df-dockerized
services:
  dragonfly-primary:
    build:
      context: .
      args:
        DF_TAG: v1.30.1
    image: df-dockerized:v1.30.1
    command: [
      "--admin_port=10001",
      "--requirepass={{ .DF_PASSWORD }}",
      "--port=6379",
      "--bind=0.0.0.0",
      "--cache_mode=true",
      "--dir=/data",
      "--dbfilename=dump-{timestamp}",
      "--snapshot_cron=*/30 * * * *"
    ]
    mem_limit: {{ .DF_MEM }}
    cpus: {{ .DF_CPUS }}
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "-a", "{{ .DF_PASSWORD }}", "PING"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - ./ssl:/ssl:ro
      - primary_data:/data
      - ./backups:/backups
    restart: unless-stopped
    networks:
      - default

  dragonfly-replica:
    image: df-dockerized:v1.30.1
    command: [
      "--admin_port=10002",
      "--requirepass={{ .DF_PASSWORD }}",
      "--masterauth={{ .DF_PASSWORD }}",
      "--port=6380",
      "--bind=0.0.0.0",
      "--cache_mode=true",
      "--dir=/data",
      "--dbfilename=replica-{timestamp}",
      "--snapshot_cron=*/30 * * * *"
    ]
    mem_limit: {{ .DF_MEM }}
    cpus: {{ .DF_CPUS }}
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "-a", "{{ .DF_PASSWORD }}", "PING"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      dragonfly-primary:
        condition: service_healthy
    volumes:
      - ./ssl:/ssl:ro
      - replica_data:/data
      - ./backups:/backups
    restart: unless-stopped
    networks:
      - default

  dragonfly-replica-2:
    image: df-dockerized:v1.30.1
    command: [
      "--admin_port=10003",
      "--requirepass={{ .DF_PASSWORD }}",
      "--masterauth={{ .DF_PASSWORD }}",
      "--port=6381",
      "--bind=0.0.0.0",
      "--cache_mode=true",
      "--dir=/data",
      "--dbfilename=replica2-{timestamp}",
      "--snapshot_cron=*/30 * * * *"
    ]
    mem_limit: {{ .DF_MEM }}
    cpus: {{ .DF_CPUS }}
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "-a", "{{ .DF_PASSWORD }}", "PING"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      dragonfly-primary:
        condition: service_healthy
    volumes:
      - ./ssl:/ssl:ro
      - replica2_data:/data
      - ./backups:/backups
    restart: unless-stopped
    networks:
      - default

  haproxy:
    image: haproxy:3.1-alpine
    mem_limit: {{ .HAPROXY_MEM }}
    cpus: {{ .HAPROXY_CPUS }}
    ports:
      - "{{ .DF_PORT }}:6379"
      - "{{ .DF_REPLICA_PORT }}:6380"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./ssl:/ssl:ro
    depends_on:
      dragonfly-primary:
        condition: service_healthy
      dragonfly-replica:
        condition: service_healthy
      dragonfly-replica-2:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

volumes:
  primary_data:
  replica_data:
  replica2_data:
