global
  daemon
  maxconn 4096

defaults
  mode tcp
  timeout connect 5s
  timeout client 30s
  timeout server 30s

# Writes -> primary (the app entry, :6379 published).
frontend redis-write
  bind *:6379 ssl crt /ssl/server.pem ca-ignore-err all
  default_backend redis-primary

# Reads -> replicas round-robin (:6380, TLS; keeps the primary write-only).
frontend redis-read
  bind *:6380 ssl crt /ssl/server.pem ca-ignore-err all
  default_backend redis-replicas

backend redis-primary
  option tcp-check
  server primary dragonfly-primary:6379 check inter 5s rise 2 fall 3

backend redis-replicas
  balance roundrobin
  option tcp-check
  server replica-1 dragonfly-replica:6380 check inter 5s rise 2 fall 3
  server replica-2 dragonfly-replica-2:6381 check inter 5s rise 2 fall 3
