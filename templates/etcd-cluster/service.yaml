name: etcd-cluster
description: etcd in k3s via the bitnami helm chart - external DCS for in-cluster services needing etcd (k3s keeps its own embedded one). S3 snapshot backup/restore for DR.
services:
  - bitnami/etcd (helm chart, 3-member StatefulSet, quorum 2/3)
  - etcd-headless svc (peer discovery) + etcd client svc (internal service DNS, no host ports)
env:
  ETCD_K8S_NAMESPACE: etcd
  ETCD_K8S_RELEASE: etcd
  ETCD_K8S_TAG: 3.5.15
  ETCD_K8S_REPLICAS: "3"
  ETCD_K8S_HELM_VERSION: v3.15.4
health:
  path: /health
  interval: 15
commands:
  deploy: bash init.sh
  init: bash init.sh
  validate: bash validate.sh
  test: bash test/test.sh
  backup: bash backup-s3.sh
  restore: bash restore-s3.sh [snapshot]
