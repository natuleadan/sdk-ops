# nats-bare - rendered NATS JetStream cluster node config (native nats-server
# + systemd, no Docker). Same render inputs as nats-dockerized; only the paths
# differ: certs live in the service dir, the JetStream store in /var/lib/nats.
server_name: {{ .ServerName }}
{{ if .ServerTags }}server_tags: {{ .ServerTags }}
{{ end }}{{ if .ClientAdvertise }}client_advertise: {{ .ClientAdvertise }}
{{ end }}listen: 0.0.0.0:4222
http: 127.0.0.1:8222
max_connections: {{ .MaxConnections }}
max_payload: 1MB
max_pending: 100MB

tls {
  cert_file: "/opt/sdk-ops/services/nats-bare/certs/server.pem"
  key_file:  "/opt/sdk-ops/services/nats-bare/certs/server.key"
  ca_file:   "/opt/sdk-ops/services/nats-bare/certs/ca.pem"
  timeout: 2
  verify: true
  handshake_first: true
}

jetstream {
  store_dir: /var/lib/nats
  max_memory_store: {{ .MaxMemoryStore }}
  max_file_store: {{ .MaxFileStore }}
  sync_interval: 120s
{{ if .JSKey }}  # At-rest encryption key (operator env NATS_JS_KEY at render time).
  key: {{ .JSKey }}
{{ end }}}

cluster {
  name: {{ .ClusterName }}
  listen: 0.0.0.0:6222
  advertise: {{ hostport .Advertise }}:6222
  routes: [
    {{ range .Routes }}"nats://{{ hostport . }}:6222"
    {{ end }}
  ]
  tls {
    cert_file: "/opt/sdk-ops/services/nats-bare/certs/server.pem"
    key_file:  "/opt/sdk-ops/services/nats-bare/certs/server.key"
    ca_file:   "/opt/sdk-ops/services/nats-bare/certs/ca.pem"
  }
}

system_account: SYS
authorization {
  timeout: "2s"
  users: [
    {
      user: "app"
      password: "{{ .AppPasswordHash }}"
      permissions: {
        publish: {
          allow: {{ .AppPublishAllow }}
        }
        subscribe: {
          allow: {{ .AppSubscribeAllow }}
        }
      }
    }
    {
      user: "svc"
      password: "{{ .SvcPasswordHash }}"
      permissions: {
        publish: {
          allow: ["svc.>"]
          deny: ["svc.secret"]
        }
        subscribe: {
          allow: ["svc.>", "_INBOX.>"]
          deny: ["svc.audit.>"]
        }
      }
    }
  ]
}
accounts {
  SYS: {
    users: [
      { user: "sys", password: "{{ .SysPasswordHash }}" }
    ]
  }
}
