# yuga-docker — resource profiles, sized for the underlying VPS.
# The provisioner (sdk-ops) renders these into the compose resource limits.
lite:        # 1c / 2GB (small VPS — 3 nodes fit, tight)
  yb_cpus: 0.5
  yb_mem: 1g
  yb_shards: 2
normal:      # 2c / 4GB
  yb_cpus: 1
  yb_mem: 2g
  yb_shards: 4
medium:      # 4c / 8GB
  yb_cpus: 1.5
  yb_mem: 4g
  yb_shards: 4
large:       # 8c / 16GB
  yb_cpus: 3
  yb_mem: 8g
  yb_shards: 8
