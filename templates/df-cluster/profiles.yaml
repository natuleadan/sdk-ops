# df-cluster — resource profiles (k3s Dragonfly CR sizing).
# Dragonfly requires >=256MiB per proactor thread (it exits below that), so
# lite keeps the floor + headroom instead of the generic 128Mi.
lite:        # 0.1c / 384Mi per pod (Dragonfly floor + tiny-node coexistence)
  cpu: "100m"
  mem: 384Mi
  storage: 1Gi
normal:      # 1c / 1Gi
  cpu: "1"
  mem: 1Gi
  storage: 2Gi
medium:      # 2c / 2Gi
  cpu: "2"
  mem: 2Gi
  storage: 5Gi
large:       # 4c / 4Gi
  cpu: "4"
  mem: 4Gi
  storage: 10Gi
