name: libsql-dockerized
services:
  sqld-primary:
    build: .
    image: libsql-dockerized:v0.24.33
    command:
      - sqld
      - --http-listen-addr=0.0.0.0:8080
      - --grpc-listen-addr=0.0.0.0:5001
      - --snapshot-exec=/snapshot.sh
      - --max-log-duration=30
    ports:
      - "{{ .LIBSQL_HTTP }}:8080"
    volumes:
      - primary_data:/var/lib/sqld
      - ./backups:/backups
      - ./tls:/tls:ro
    environment:
      SQLD_NODE: primary
    mem_limit: {{ .SQLD_MEM }}
    cpus: {{ .SQLD_CPUS }}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - default

  sqld-replica:
    build: .
    image: libsql-dockerized:v0.24.33
    command:
      - sqld
      - --http-listen-addr=0.0.0.0:8080
      - --primary-grpc-url=http://sqld-primary:5001
    depends_on:
      sqld-primary:
        condition: service_healthy
    ports:
      - "{{ .LIBSQL_REPLICA_HTTP }}:8080"
    volumes:
      - replica_data:/var/lib/sqld
      - ./tls:/tls:ro
    environment:
      SQLD_NODE: replica
    mem_limit: {{ .SQLD_MEM }}
    cpus: {{ .SQLD_CPUS }}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - default

  sqld-replica-2:
    build: .
    image: libsql-dockerized:v0.24.33
    command:
      - sqld
      - --http-listen-addr=0.0.0.0:8080
      - --primary-grpc-url=http://sqld-primary:5001
    depends_on:
      sqld-primary:
        condition: service_healthy
    ports:
      - "{{ .LIBSQL_REPLICA2_HTTP }}:8080"
    volumes:
      - replica2_data:/var/lib/sqld
      - ./tls:/tls:ro
    environment:
      SQLD_NODE: replica
    mem_limit: {{ .SQLD_MEM }}
    cpus: {{ .SQLD_CPUS }}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - default

  router:
    image: libsql-dockerized-router:v0.24.33
    ports:
      - "{{ .LIBSQL_HTTP_TLS }}:8443"
    volumes:
      - ./tls:/tls:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      etcd:
        condition: service_healthy
      sqld-primary:
        condition: service_healthy
      sqld-replica:
        condition: service_healthy
      sqld-replica-2:
        condition: service_healthy
    environment:
      ETCD_ENDPOINTS: http://etcd:2379
      CLUSTER_SCOPE: libsql-dockerized
      TLS_CERT: /tls/server_cert.pem
      TLS_KEY: /tls/server_key.pem
    mem_limit: {{ .ROUTER_MEM }}
    cpus: {{ .ROUTER_CPUS }}
    restart: unless-stopped
    networks:
      - default

  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    command:
      - etcd
      - --name=etcd-0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd-0=http://etcd:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=libsql
      - --enable-v2=true
    volumes:
      - etcd_data:/etcd-data
    mem_limit: {{ .ETCD_MEM }}
    cpus: {{ .ETCD_CPUS }}
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - default

  controller:
    image: libsql-dockerized-controller:v0.24.33
    depends_on:
      etcd:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      ETCD_ENDPOINTS: http://etcd:2379
      CLUSTER_SCOPE: libsql-dockerized
      HEALTH_INTERVAL: 5s
      HEALTH_THRESHOLD: 3
      HTTP_PORT: 9090
    ports:
      - "{{ .CONTROLLER_PORT }}:9090"
    mem_limit: {{ .CONTROLLER_MEM }}
    cpus: {{ .CONTROLLER_CPUS }}
    restart: unless-stopped
    networks:
      - default

volumes:
  primary_data:
  replica_data:
  replica2_data:
  etcd_data:
