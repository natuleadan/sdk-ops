# HAProxy TLS entrypoint (df-bare) - native haproxy, config installed at
# /etc/haproxy/hap.cfg by init.sh (the distro unit reads CONFIG from
# /etc/default/haproxy).
# Split frontends: writes go to the primary, reads round-robin over the two
# replicas (same pattern as df-dockerized; legacy replication keeps replicas
# serving reads locally). All dragonfly ports bind loopback only - these two
# TLS ports are the public surface. No `daemon` directive: the distro systemd
# unit runs haproxy with -Ws.

global
  maxconn 4096

defaults
  mode tcp
  timeout connect 5s
  timeout client 30s
  timeout server 30s

# Writes -> primary (:6443 published).
frontend df-write
  bind *:6443 ssl crt /etc/haproxy/ssl/server.pem
  default_backend df-primary

# Reads -> replicas round-robin (:6444, TLS).
frontend df-read
  bind *:6444 ssl crt /etc/haproxy/ssl/server.pem
  default_backend df-replicas

backend df-primary
  option tcp-check
  server primary 127.0.0.1:6379 check inter 5s rise 2 fall 3

backend df-replicas
  balance roundrobin
  option tcp-check
  server replica-1 127.0.0.1:6380 check inter 5s rise 2 fall 3
  server replica-2 127.0.0.1:6381 check inter 5s rise 2 fall 3
