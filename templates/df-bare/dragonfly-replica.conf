# Dragonfly Replica Configuration (df-bare)
# Reference: https://www.dragonflydb.io/docs/managing-dragonfly/flags
#
# NATIVE flagfile (no Docker) - loaded by dragonfly-replica-1.service via
# --flagfile. init.sh renders a second copy for replica-2 (ports 6381/10003,
# its own data dir). One flag per line, # comments. Edit this file, then
# restart: systemctl restart dragonfly-replica-1 dragonfly-replica-2

# === Replication ===
# Legacy replication (no cluster_mode): replicas keep serving reads locally
# (--cluster_mode=yes would redirect every read to the master and kill the
# HAProxy read/write split).
--admin_port=10002

# === Auth ===
--requirepass={{ .DF_PASSWORD }}
# The master is password-protected — the replica authenticates with masterauth.
--masterauth={{ .DF_PASSWORD }}

# === Network ===
# Loopback only + follow the local primary over its native port. The flag
# value is host:port (the REPLICAOF command form uses two arguments).
--port=6380
--bind=127.0.0.1
--replicaof=127.0.0.1:6379

# === Memory ===
--cache_mode=true
--maxmemory=0
# The memory ceiling is enforced by systemd (MemoryMax in the unit file).

# === Persistence ===
--dir=/var/lib/dragonfly/replica-1
--dbfilename=replica-{timestamp}
--snapshot_cron=*/30 * * * *

# === SSD Data Tiering (v1.35+, kernel >= 5.19 with io_uring) ===
# Disabled: the pinned binary (v1.30.1) predates these flags.
# --tiered_prefix=/var/lib/dragonfly/replica-1-tier
# --tiered_offload_threshold=0.4
# --tiered_upload_threshold=0.2
