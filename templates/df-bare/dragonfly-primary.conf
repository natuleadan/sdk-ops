# Dragonfly Primary Configuration (df-bare)
# Reference: https://www.dragonflydb.io/docs/managing-dragonfly/flags
#
# NATIVE flagfile (no Docker) - loaded by dragonfly-primary.service via
# --flagfile. One flag per line, # comments. Edit this file, then restart:
# systemctl restart dragonfly-primary

# === Cluster ===
--admin_port=10001

# === Auth ===
--requirepass={{ .DF_PASSWORD }}

# === Network ===
# Loopback only: the HAProxy TLS entrypoint (:6443) is the public surface.
--port=6379
--bind=127.0.0.1

# === Memory ===
--cache_mode=true
--maxmemory=0
# The memory ceiling is enforced by systemd (MemoryMax in the unit file).

# === Persistence ===
--dir=/var/lib/dragonfly/primary
--dbfilename=dump-{timestamp}
--snapshot_cron=*/30 * * * *

# === SSD Data Tiering (v1.35+, kernel >= 5.19 with io_uring) ===
# Disabled: the pinned binary (v1.30.1) predates these flags.
# --tiered_prefix=/var/lib/dragonfly/primary-tier
# --tiered_offload_threshold=0.4
# --tiered_upload_threshold=0.2
