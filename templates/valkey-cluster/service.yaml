name: valkey-cluster
description: Native Valkey Cluster on k3s — 3 primaries + 3 replicas (6 pods), 16384 hash slots sharded, automatic failover built into the cluster protocol (no Sentinel, no operator), per-shard S3 backups.
services:
  - Valkey StatefulSet (6 pods, cluster-enabled, pinned image)
  - Seed Service (ClusterIP) + headless Service for stable pod DNS
env:
  VK_K8S_NAMESPACE: valkey
  VK_K8S_NAME: valkey
  VK_K8S_TAG: "8.1.3"
  VK_K8S_NODES: "6"
  VK_K8S_CLUSTER_REPLICAS: "1"
health:
  path: /
  interval: 15
commands:
  init: bash init.sh
  validate: bash validate.sh
  test: bash test/test.sh
  backup: bash backup-s3.sh
  restore: bash restore-s3.sh [--yes] [YYYY-MM-DD-HHMMSS]
