# pgbackrest.conf — the CONTAINER config (mounted at /etc/pgbackrest/pgbackrest.conf):
# the archive_command + the backups run inside the Patroni container (pg1-path =
# the container's data dir). The RESTORE runs on the HOST with the local conf
# (pgbackrest.local.conf — written by the wiring).
[main]
pg1-path=/var/lib/postgresql/data
pg1-user=dev

[global]
repo1-type=s3
repo1-s3-endpoint={{ .S3Endpoint }}
repo1-s3-region={{ .S3Region }}
repo1-s3-bucket={{ .S3Bucket }}
repo1-s3-key={{ .S3AccessKey }}
repo1-s3-key-secret={{ .S3SecretKey }}
repo1-s3-uri-style=path
repo1-path=/{{ .S3Prefix }}
repo1-retention-full=2
repo1-retention-diff=4
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass={{ .PGCipherPass }}
repo1-bundle=y
repo1-block=y
buffer-path=/tmp
spool-path=/tmp

[global:archive-get]
compress-level=1
